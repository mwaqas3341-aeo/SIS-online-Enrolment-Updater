name: Scrape SIS PESRP

on:
  schedule:
    # PKT = UTC+5, no DST.
    # 23:00 UTC = 04:00 PKT  (primary run, right after the site's
    #   apparent 1-3 AM PKT maintenance window closes)
    # 01:00 UTC = 06:00 PKT  (safety-net run — only produces a new
    #   commit if the 4 AM run was incomplete or failed; if data is
    #   already complete this run finds no diff and commits nothing)
    - cron: '0 23 * * *'
    - cron: '0 1 * * *'
  workflow_dispatch:        # manual trigger

# Only cancel a run if the SAME run type is still going when its own
# next trigger fires (extremely unlikely at 1-2 runs/day). Don't let
# the 4 AM and 6 AM runs cancel each other.
concurrency:
  group: scrape-sis-pesrp
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    # Generous ceiling: this now runs deliberately slower (low
    # concurrency + retry rounds) to guarantee completeness, so give
    # it room instead of racing the old 12-minute budget.
    timeout-minutes: 240
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4

      - name: Run scraper
        run: python fetch.py

      - name: Build CSV summary
        run: python scripts/export_csv.py

      - name: Commit results
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m \
            "scrape: $(date -u +'%Y-%m-%d %H:%M UTC')"

          # The scrape can take a while, so main may have moved on since
          # this job's checkout. Rebase our data/ commit onto the latest
          # remote history before pushing, and retry a few times in case
          # of another late push.
          for i in 1 2 3 4 5; do
            git rebase --abort 2>/dev/null || true
            git fetch origin main
            git rebase origin/main && git push origin main && break
            echo "Push attempt $i failed or rebase conflicted, retrying..."
            sleep 10
          done
